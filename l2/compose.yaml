services:
  app:
    build: .
    ports:
      - "3102:3102"
    environment:
      PORT: 3102
      DATABASE_URL: postgres://jason:jason@db:5432/quotes
      DATA_DIR: /app/data
    volumes:
      - uploads:/app/data
    depends_on: [db]
    restart: on-failure
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: jason
      POSTGRES_PASSWORD: jason
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
  uploads:
